name: Swift (iOS 18)

on: [push]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on iOS
    strategy:
      matrix:
        os: [macos-26]
        swift: ["6.3.2"]
    runs-on: ${{ matrix.os }}
    env:
      SWIFT_COLLECTIVE_DYNAMIC_LIBRARIES: 1
    steps:
      - uses: actions/checkout@v4
      - name: 🦦 Install Swift Bundler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo moreSwift/swift-bundler --pattern 'swift-bundler-*-macos-universal' --output swift-bundler
          chmod +x ./swift-bundler
          sudo mv ./swift-bundler /usr/local/bin/
          swift-bundler --version
      - name: 📦 Build & Bundle
        run: swift-bundler bundle UsdView --platform iOSSimulator
      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: usdview-ios-artifacts
          path: .build/bundler/apps/UsdView/UsdView.app
