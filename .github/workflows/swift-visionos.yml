name: Swift (visionOS 2)

on: [push]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on visionOS
    strategy:
      matrix:
        os: [macos-26]
        swift: ["6.3.2"]
    runs-on: ${{ matrix.os }}
    env:
      SWIFT_COLLECTIVE_DYNAMIC_LIBRARIES: 1
    steps:
      - uses: actions/checkout@v4
      - name: 🦦 Install Swift Bundler
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFT_BUNDLER_TAG: v3.1.0-furby.1
        run: |
          gh release download "$SWIFT_BUNDLER_TAG" --repo furbytm/swift-bundler --pattern 'swift-bundler-*-macos-universal*'
          shasum -a 256 -c swift-bundler-*-macos-universal.sha256
          chmod +x swift-bundler-*-macos-universal
          sudo mv swift-bundler-*-macos-universal /usr/local/bin/swift-bundler
          rm swift-bundler-*-macos-universal.sha256
          swift-bundler --version
      - name: 📦 Build & Bundle
        run: swift-bundler bundle UsdView --platform visionOSSimulator
      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: usdview-visionos-artifacts
          path: .build/bundler/apps/UsdView/UsdView.app
